<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>503 - 维护中</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f1a;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    .code {
      font-size: clamp(6rem, 15vw, 12rem);
      font-weight: 800;
      letter-spacing: -0.05em;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: breathe 3s ease-in-out infinite;
      line-height: 1;
      margin-bottom: 1rem;
    }

    .message {
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      color: rgba(255,255,255,0.6);
      margin-bottom: 2rem;
    }

    .pulse-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      background: #667eea;
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 1.5s ease-in-out infinite;
      vertical-align: middle;
    }

    @keyframes breathe {
      0%, 100% { opacity: 1; filter: brightness(1); }
      50% { opacity: 0.7; filter: brightness(0.8); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.5); opacity: 0.4; }
    }

    /* 背景装饰 */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 40%, rgba(102,126,234,0.08) 0%, transparent 50%),
                  radial-gradient(circle at 70% 60%, rgba(118,75,162,0.06) 0%, transparent 50%);
      animation: drift 20s ease-in-out infinite;
      z-index: -1;
    }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-2%, -1%); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">503</div>
    <p class="message"><span class="pulse-dot"></span>服务正在维护，稍后回来</p>
  </div>
</body>
</html>
